---
- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install system utility packages
  apt:
    name:
      - curl
      - git
      - ufw
      - htop
      - net-tools
      - unzip
    state: present

- name: Configure UFW firewall rules
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"
    - "3000"
    - "8000"
    - "9090"
    - "3001"

- name: Enable UFW firewall
  ufw:
    state: enabled
